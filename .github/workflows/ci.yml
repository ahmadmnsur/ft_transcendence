name: CI

"on":
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHECKPOINT_DISABLE: 1
    services:
      postgres:
        image: postgres:17-alpine
        # Must equal .env.example's POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB,
        # here and in --health-cmd below: a service container cannot read the file (§16.4).
        env:
          POSTGRES_USER: peerconnect
          POSTGRES_PASSWORD: peerconnect-dev-password
          POSTGRES_DB: peerconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U peerconnect -d peerconnect"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix web ci
      - name: Load .env.example
        run: |
          grep -v '^#' .env.example | grep -v '^$' >> "$GITHUB_ENV"
          DATABASE_URL_VALUE="$(grep '^DATABASE_URL=' .env.example | cut -d= -f2-)"
          REWRITTEN_URL="$(echo "$DATABASE_URL_VALUE" | sed 's/@db:5432/@localhost:5432/')"
          echo "DATABASE_URL=$REWRITTEN_URL" >> "$GITHUB_ENV"
      - run: npx prisma generate --config prisma.config.ts
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm --prefix web run typecheck
      - run: npx nest build
      - run: npx prisma migrate deploy --config prisma.config.ts
      - run: npx prisma db seed --config prisma.config.ts
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: npx vitest run
