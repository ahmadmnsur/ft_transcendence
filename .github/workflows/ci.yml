name: CI

"on":
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHECKPOINT_DISABLE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx prisma generate --config prisma.config.ts
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm --prefix web run build
      - run: npx nest build
      - name: Check the local Supabase copy
        run: |
          set -e
          compose=(docker compose -p peerconnect-test --env-file .env.example -f compose.yaml -f compose.dev.yaml -f compose.local.yaml)
          cleanup() {
            status=$?
            "${compose[@]}" down --volumes --remove-orphans || { if [ "$status" -eq 0 ]; then status=1; fi; }
            exit "$status"
          }
          trap cleanup EXIT
          "${compose[@]}" down --volumes --remove-orphans
          "${compose[@]}" build api
          "${compose[@]}" up -d db auth storage api-gw
          "${compose[@]}" run --rm api sh -c '
            set -e
            npx prisma migrate deploy --config prisma.config.ts
            npx prisma db seed --config prisma.config.ts
            second=$(npx prisma db seed --config prisma.config.ts)
            printf "%s\n" "$second"
            printf "%s\n" "$second" | grep -q "seed already complete"
            npx vitest run
          '
