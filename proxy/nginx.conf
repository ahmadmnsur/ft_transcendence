user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    error_log /dev/null;

    map $request_uri $pc_path {
        "~^(?<p>[^?]*)" $p;
    }

    map $http_referer $pc_referer {
        "~^(?<r>[^?#]*)" $r;
    }

    log_format pc_request '$time_iso8601 $remote_addr "$request_method $pc_path" '
                          '$status $body_bytes_sent "$pc_referer" "$http_user_agent"';
    access_log /dev/stdout pc_request;

    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream peerconnect_api {
        server api:3000;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
