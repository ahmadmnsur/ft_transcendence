name: peerconnect

x-logging: &pc-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-env-file: &pc-env-file
  - path: .env
    required: true

x-fallback-env-file: &pc-fallback-env-file
  - path: .env
    required: true

x-local-values: &pc-local-values
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  DATABASE_URL: ${LOCAL_DATABASE_URL:-}
  PUBLIC_ORIGIN: ${LOCAL_PUBLIC_ORIGIN:-}
  BIND_ADDRESS: ${LOCAL_BIND_ADDRESS:-}
  ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
  MODERATOR_PASSWORD: ${LOCAL_MODERATOR_PASSWORD:-}
  SEED_STUDENT_PASSWORD: ${LOCAL_SEED_STUDENT_PASSWORD:-}
  FT_OAUTH_CLIENT_ID: ${LOCAL_FT_OAUTH_CLIENT_ID:-}
  FT_OAUTH_CLIENT_SECRET: ${LOCAL_FT_OAUTH_CLIENT_SECRET:-}
  SUPABASE_URL: ${LOCAL_SUPABASE_URL:-}
  SUPABASE_PUBLISHABLE_KEY: ${LOCAL_SUPABASE_PUBLISHABLE_KEY:-}
  SUPABASE_SECRET_KEY: ${LOCAL_SUPABASE_SECRET_KEY:-}

services:
  db:
    image: supabase/postgres:17.6.1.136
    profiles: [local]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic", "-c", "auto_explain.log_min_duration=-1", "-c", "log_statement=none"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro,Z
      - ./supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro,Z
    env_file: *pc-fallback-env-file
    environment:
      <<: *pc-local-values
      POSTGRES_USER: supabase_admin
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      # Must equal .env.example's POSTGRES_PASSWORD; plain value so a .env value
      # cannot reach the fallback.
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: postgres
      JWT_EXP: 3600
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *pc-logging

  auth:
    image: supabase/gotrue:v2.196.0
    profiles: [local]
    depends_on:
      db:
        condition: service_healthy
    env_file: *pc-fallback-env-file
    environment:
      <<: *pc-local-values
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://api-gw:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      # Must equal .env.example's POSTGRES_PASSWORD; plain value so a .env value
      # cannot reach the fallback.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres
      GOTRUE_SITE_URL: ${LOCAL_PUBLIC_ORIGIN:-}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ISSUER: http://api-gw:8000/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_AUDIT_LOG_DISABLE_POSTGRES: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *pc-logging

  storage:
    image: supabase/storage-api:v1.74.0
    profiles: [local]
    depends_on:
      db:
        condition: service_healthy
    env_file: *pc-fallback-env-file
    environment:
      <<: *pc-local-values
      # Must equal .env.example's POSTGRES_PASSWORD; plain value so a .env value
      # cannot reach the fallback.
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://api-gw:8000
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *pc-logging

  api-gw:
    image: envoyproxy/envoy:v1.39.1
    profiles: [local]
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    env_file: *pc-fallback-env-file
    environment: *pc-local-values
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    volumes:
      - ./supabase/api/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./supabase/api/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./supabase/api/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./supabase/api/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *pc-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
        required: false
      api-gw:
        condition: service_healthy
        required: false
    env_file: *pc-env-file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 900s
    restart: "no"
    init: true
    logging: *pc-logging

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    env_file: *pc-env-file
    logging: *pc-logging

volumes:
  db-data:
  db-config:
  storage-data:
